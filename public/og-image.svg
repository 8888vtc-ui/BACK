<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Backgammon Tour — Cercle Monte-Carlo &amp; Gammon Academy">
  <defs>
    <radialGradient id="ogBg" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#241b0b"/>
      <stop offset="40%" stop-color="#0e1422"/>
      <stop offset="85%" stop-color="#06090f"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>
    <linearGradient id="ogGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9e6"/>
      <stop offset="35%" stop-color="#f3c65f"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c5f12"/>
    </linearGradient>
    <linearGradient id="ogTextGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff9e6"/>
      <stop offset="50%" stop-color="#f0cb69"/>
      <stop offset="100%" stop-color="#9c6f16"/>
    </linearGradient>
    <filter id="ogShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Fond Salon Privé Monte-Carlo -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="28" fill="none" stroke="url(#ogGold)" stroke-width="3" opacity="0.75"/>
  <rect x="42" y="42" width="1116" height="546" rx="20" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="8,6" opacity="0.35"/>

  <!-- Flèches de Backgammon décoratives en bas -->
  <g opacity="0.16">
    <polygon points="80,588 150,588 115,370" fill="#d4af37"/>
    <polygon points="165,588 235,588 200,400" fill="#475569"/>
    <polygon points="250,588 320,588 285,370" fill="#d4af37"/>
    <polygon points="880,588 950,588 915,370" fill="#d4af37"/>
    <polygon points="965,588 1035,588 1000,400" fill="#475569"/>
    <polygon points="1050,588 1120,588 1085,370" fill="#d4af37"/>
  </g>

  <!-- Blason Central Supérieur -->
  <g transform="translate(600, 128)" filter="url(#ogShadow)">
    <polygon points="-48,-58 48,-58 68,0 0,58 -68,0" fill="#0d121d" stroke="url(#ogGold)" stroke-width="4"/>
    <path d="M-28,-12 L-16,-32 L-4,-16 L0,-38 L4,-16 L16,-32 L28,-12 Z" fill="url(#ogGold)"/>
    <circle cx="-18" cy="14" r="14" fill="#0f172a" stroke="url(#ogGold)" stroke-width="2.5"/>
    <circle cx="18" cy="14" r="14" fill="#fde68a" stroke="#78500d" stroke-width="2.5"/>
  </g>

  <!-- Sur-titre Domaine & Prestige -->
  <text x="600" y="232" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#e5c158" letter-spacing="8">
    BACKGAMMONTOUR.COM · GAMMONACADEMY.COM
  </text>

  <!-- Titre Principal -->
  <text x="600" y="325" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="900" fill="url(#ogTextGold)" letter-spacing="10" filter="url(#ogShadow)">
    BACKGAMMON TOUR
  </text>

  <!-- Sous-titre Cercle Monte-Carlo -->
  <text x="600" y="378" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#fef3c7" letter-spacing="6">
    CERCLE MONTE-CARLO · GRAND MAÎTRE IA OPEN SAGE 3-PLY
  </text>

  <!-- 3 Badges Piliers -->
  <g transform="translate(600, 455)" filter="url(#ogShadow)">
    <rect x="-470" y="-28" width="290" height="56" rx="28" fill="#0e1422" stroke="url(#ogGold)" stroke-width="2"/>
    <text x="-325" y="6" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#f5cf70" letter-spacing="2">🎲 OPEN SAGE 3-PLY (PR 0.23)</text>

    <rect x="-145" y="-28" width="290" height="56" rx="28" fill="#0e1422" stroke="url(#ogGold)" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#f5cf70" letter-spacing="2">🏆 MATCHS OFFICIELS &amp; ELO</text>

    <rect x="180" y="-28" width="290" height="56" rx="28" fill="#0e1422" stroke="url(#ogGold)" stroke-width="2"/>
    <text x="325" y="6" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#f5cf70" letter-spacing="2">🎯 GAMMON ACADEMY &amp; DRILLS</text>
  </g>

  <!-- Pied de page -->
  <text x="600" y="555" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#94a3b8" letter-spacing="2">
    Analyse d’Équité en Temps Réel · Videau Kazaross-XG2 · Bear-Off Exact 54 264 États · 100 % Jouable Hors-Ligne
  </text>
</svg>
