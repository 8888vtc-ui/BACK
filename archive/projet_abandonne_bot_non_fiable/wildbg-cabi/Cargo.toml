[package]
name = "wildbg-cabi"
description = "C ABI bindings for WildBG backgammon engine (no wasm-bindgen)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
engine = { path = "../engine" }
logic = { path = "../logic" }

# The `nets` branch pulls `getrandom 0.2` (via tract-onnx 0.21 -> rand 0.8),
# which does not support wasm32-unknown-unknown by default. Enable the `js`
# feature on `getrandom 0.2` so the WASM build links against
# `crypto.getRandomValues`.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
