name: Mobile Release - App Store & Google Play

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Nom de version public (ex: 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Code de version numérique incrémental (ex: 10)'
        required: true
        default: '1'
      target:
        description: 'Cible de publication'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
      deploy_track:
        description: 'Canal de publication Google Play'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - production

concurrency:
  group: release-mobile-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ===========================================================================
  # 1. Compilation des Assets Web & Synchronisation Capacitor
  # ===========================================================================
  build-web-assets:
    name: Build Web & Sync Capacitor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js Static Export & Sync Capacitor
        run: npm run build:mobile

      - name: Archive Android Web Assets
        uses: actions/upload-artifact@v4
        with:
          name: android-public-assets
          path: android/app/src/main/assets/public/
          retention-days: 2

      - name: Archive iOS Web Assets
        uses: actions/upload-artifact@v4
        with:
          name: ios-public-assets
          path: ios/App/App/public/
          retention-days: 2

  # ===========================================================================
  # 2. Release Android (Compilation AAB, Signature & Google Play)
  # ===========================================================================
  release-android:
    name: Release Android (Google Play AAB)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'android' }}
    needs: [build-web-assets]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Download Synchronized Web Assets
        uses: actions/download-artifact@v4
        with:
          name: android-public-assets
          path: android/app/src/main/assets/public/

      - name: Decode Android Keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Signed Android App Bundle (AAB)
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name || github.ref_name }}
          VERSION_CODE: ${{ inputs.version_code || github.run_number }}
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backgammon-release.aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

      # Déploiement automatique vers Google Play si le JSON de compte de service est configuré
      - name: Deploy to Google Play Console
        if: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.backgammon.coach
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: ${{ inputs.deploy_track || 'internal' }}
          status: completed

  # ===========================================================================
  # 3. Release iOS (Compilation IPA, Signature & TestFlight)
  # ===========================================================================
  release-ios:
    name: Release iOS (TestFlight / App Store IPA)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'ios' }}
    needs: [build-web-assets]
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Synchronized Web Assets
        uses: actions/download-artifact@v4
        with:
          name: ios-public-assets
          path: ios/App/App/public/

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      - name: Install Fastlane
        run: bundle install || gem install fastlane

      - name: Build iOS Archive & Export IPA
        run: |
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO || true

      - name: Summary Notice
        run: |
          echo "### Publication Mobile" >> $GITHUB_STEP_SUMMARY
          echo "Le build mobile est prêt pour les stores :" >> $GITHUB_STEP_SUMMARY
          echo "- **Android** : \`backgammon-release.aab\` généré et disponible en téléchargement d'artefact." >> $GITHUB_STEP_SUMMARY
          echo "- **iOS** : Archive Xcode prête. Pour soumettre à TestFlight via Fastlane : \`bundle exec fastlane ios deploy_testflight\`." >> $GITHUB_STEP_SUMMARY
